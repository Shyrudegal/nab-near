<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAB NEAR - Clothes & Accessories</title>
<style>
body{margin:0;font-family:Arial;background:#fafafa;padding-bottom:80px}
header{display:flex;justify-content:space-between;padding:16px 20px;background:#000;color:#fff;position:sticky;top:0;z-index:20}
.logo{font-weight:900;letter-spacing:3px}
.search{padding:15px;background:#fff;display:flex;gap:10px;position:sticky;top:56px;z-index:10}
.search input{flex:1;padding:12px 15px;border-radius:25px;border:1px solid #ddd;outline:none}
.filters{display:flex;gap:10px;padding:0 20px 15px;background:#fff;overflow-x:auto}
.filters button{padding:8px 18px;border-radius:20px;border:1px solid #000;background:#fff;white-space:nowrap;cursor:pointer}
.filters button.active{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.card img{width:100%;height:200px;object-fit:cover}
.info{padding:10px}
.price{font-weight:bold;margin-top:4px}
.add{width:100%;margin-top:8px;padding:10px;background:#000;color:#fff;border:none;border-radius:20px;cursor:pointer;font-weight:bold}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#000;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header><div class="logo">NAB NEAR</div><div>🛒 <span id="cart-count">0</span></div></header>

<div class="search"><input id="searchInput" placeholder="Search tee, cap, bag..." onkeyup="filterSearch()"></div>

<div class="filters">
 <button class="active" onclick="filterCat('All')">All</button>
 <button onclick="filterCat('Clothes')">Clothes</button>
 <button onclick="filterCat('Accessories')">Accessories</button>
</div>

<div class="grid" id="grid">
{% for p in products %}
 <div class="card" data-name="{{ p.name.lower() }}" data-cat="{{ p.cat }}">
  <img src="{{ p.image }}">
  <div class="info">
   <div style="font-size:14px">{{ p.name }}</div>
   <div class="price">₦{{ p.price }}</div>
   <button class="add"onclick="addToCart('{{ p.name }}', {{ p.price }})" >Add to Cart</button>
  </div>
 </div>
{% endfor %}
</div>

<div class="cart-bar">
 <div><span id="cart-total">₦0</span> - <span id="cart-items">0 items</span></div>
 <button onclick="checkoutWA()" style="background:#25D366;color:#fff;padding:10px 22px;border-radius:20px;border:none;font-weight:bold;cursor:pointer">WhatsApp Order</button>
</div>

<script>
let cart=[], total=0;
function addToCart(name, price){ 
  cart.push({name,price}); 
  total+=price; 
  document.getElementById('cart-count').innerText=cart.length; 
  document.getElementById('cart-total').innerText='₦'+total; 
  document.getElementById('cart-items').innerText=cart.length+' items'; 
}
function filterCat(cat){ 
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active')); 
  event.target.classList.add('active'); 
  document.querySelectorAll('.card').forEach(c=>{ 
    c.style.display=(cat==='All'||c.dataset.cat===cat)?'block':'none'; 
  }); 
}
function filterSearch(){ 
  let q=document.getElementById('searchInput').value.toLowerCase(); 
  document.querySelectorAll('.card').forEach(c=>{ 
    c.style.display=c.dataset.name.includes(q)?'block':'none'; 
  }); 
}
function checkoutWA(){ 
  if(!cart.length)return alert('Cart empty - add something first!'); 
  let msg=cart.map(i=>i.name).join(', '); 
  window.open(`https://wa.me/2347082039080?text=Hi%20NAB%20NEAR!%20I%20want%20to%20order:%20${msg}%20-%20Total:%20₦${total}`); 
}
</script>
</body>
</html>
